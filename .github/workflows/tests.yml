# Runs the test suite on every pull request and push to main: on Linux, and on Windows for the
# Win32 parts (native overlay, notification window, hotkeys, window capture) that Linux never runs.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Schriften für die Overlay-Tests, Bibliotheken für Qt (offscreen)
        run: >-
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libegl1 libgl1 libxkbcommon0
          libfontconfig1 libdbus-1-3 libglib2.0-0t64
      - name: Pakete
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyflakes
      - name: pyflakes
        run: python -m pyflakes fogscout tests
      - name: pytest
        run: python -m pytest -q tests

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete (wie start.bat, windows-capture ohne Abhängigkeiten)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install --no-deps -r requirements-extra.txt
      - name: pytest
        env:
          PYTHONUNBUFFERED: "1"            # a crash at the very end must not swallow the summary
        run: python -X faulthandler -m pytest -q tests
